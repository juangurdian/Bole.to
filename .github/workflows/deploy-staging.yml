name: Deploy to Staging

on:
  push:
    branches:
      - develop
  pull_request:
    types: [closed]
    branches:
      - develop

  # Allow manual deployment
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment even if no changes detected'
        required: false
        default: 'false'
        type: boolean

env:
  TF_VERSION: '1.6.0'
  NODE_VERSION: '18'
  PHP_VERSION: '8.2'

jobs:
  # Job 1: Plan Infrastructure Changes
  terraform-plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra/terraform/staging
    
    outputs:
      tfplan_exitcode: ${{ steps.tf-plan.outputs.exitcode }}
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Create terraform.tfvars from secrets
        run: |
          cat > terraform.tfvars << EOF
          # DigitalOcean Configuration
          do_token = "${{ secrets.DIGITALOCEAN_TOKEN }}"
          region   = "nyc1"
          
          # Cloudflare Configuration
          cloudflare_api_token = "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          
          # Application Configuration
          app_key    = "${{ secrets.LARAVEL_APP_KEY }}"
          jwt_secret = "${{ secrets.JWT_SECRET }}"
          
          # GitHub Repository
          github_repo = "${{ github.server_url }}/${{ github.repository }}.git"
          
          # Payment Configuration
          stripe_public_key = "${{ secrets.STRIPE_PUBLIC_KEY_TEST }}"
          stripe_secret_key = "${{ secrets.STRIPE_SECRET_KEY_TEST }}"
          
          # Email Configuration
          mail_host         = "${{ secrets.MAIL_HOST }}"
          mail_port         = "${{ secrets.MAIL_PORT }}"
          mail_username     = "${{ secrets.MAIL_USERNAME }}"
          mail_password     = "${{ secrets.MAIL_PASSWORD }}"
          mail_from_address = "noreply@bole.to"
          
          # Cost Optimization
          enable_production_features = false
          database_size             = "db-s-1vcpu-1gb"
          app_instance_size         = "basic-xxs"
          EOF

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: tf-plan
        run: |
          export exitcode=0
          terraform plan -detailed-exitcode -no-color -out tfplan || export exitcode=$?
          
          echo "exitcode=$exitcode" >> $GITHUB_OUTPUT
          
          if [ $exitcode -eq 1 ]; then
            echo "Terraform Plan Failed"
            exit 1
          elif [ $exitcode -eq 0 ]; then
            echo "No changes detected"
          elif [ $exitcode -eq 2 ]; then
            echo "Changes detected"
          fi

      - name: Publish Terraform Plan
        uses: actions/upload-artifact@v3
        with:
          name: tfplan
          path: ./infra/terraform/staging/tfplan

      - name: Create Plan Summary
        run: |
          echo "### Terraform Plan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Terraform Version:** ${{ env.TF_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Working Directory:** \`./infra/terraform/staging\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.tf-plan.outputs.exitcode }}" -eq 0 ]; then
            echo "✅ **No changes detected** - Infrastructure is up to date" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.tf-plan.outputs.exitcode }}" -eq 2 ]; then
            echo "📋 **Changes detected** - Ready for deployment" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Run the deploy job to apply these changes." >> $GITHUB_STEP_SUMMARY
          fi

  # Job 2: Test Gateway Service
  test-gateway:
    name: 'Test Gateway Service'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/gateway
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './apps/gateway/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint || echo "Linting not configured, skipping..."

      - name: Run tests
        run: npm test || echo "Tests not configured, skipping..."

      - name: Verify gateway can start
        run: |
          # Set environment variables for test
          export NODE_ENV=test
          export HIEVENTS_BACKEND_URL=http://localhost:8000
          export PORT=8001
          
          # Start gateway in background
          timeout 10s npm start &
          GATEWAY_PID=$!
          
          # Wait for startup
          sleep 5
          
          # Test health endpoint
          curl -f http://localhost:8001/healthz || {
            echo "Gateway health check failed"
            kill $GATEWAY_PID 2>/dev/null || true
            exit 1
          }
          
          # Clean shutdown
          kill $GATEWAY_PID 2>/dev/null || true
          echo "Gateway started successfully"

  # Job 3: Deploy Infrastructure
  deploy:
    name: 'Deploy to Staging'
    runs-on: ubuntu-latest
    needs: [terraform-plan, test-gateway]
    if: |
      needs.terraform-plan.outputs.tfplan_exitcode == '2' ||
      github.event.inputs.force_deploy == 'true' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    
    environment:
      name: staging
      url: https://staging-api.bole.to
    
    defaults:
      run:
        working-directory: ./infra/terraform/staging
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Download Terraform Plan
        uses: actions/download-artifact@v3
        with:
          name: tfplan
          path: ./infra/terraform/staging/

      - name: Create terraform.tfvars from secrets
        run: |
          cat > terraform.tfvars << EOF
          # DigitalOcean Configuration
          do_token = "${{ secrets.DIGITALOCEAN_TOKEN }}"
          region   = "nyc1"
          
          # Cloudflare Configuration
          cloudflare_api_token = "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          
          # Application Configuration
          app_key    = "${{ secrets.LARAVEL_APP_KEY }}"
          jwt_secret = "${{ secrets.JWT_SECRET }}"
          
          # GitHub Repository
          github_repo = "${{ github.server_url }}/${{ github.repository }}.git"
          
          # Payment Configuration
          stripe_public_key = "${{ secrets.STRIPE_PUBLIC_KEY_TEST }}"
          stripe_secret_key = "${{ secrets.STRIPE_SECRET_KEY_TEST }}"
          
          # Email Configuration
          mail_host         = "${{ secrets.MAIL_HOST }}"
          mail_port         = "${{ secrets.MAIL_PORT }}"
          mail_username     = "${{ secrets.MAIL_USERNAME }}"
          mail_password     = "${{ secrets.MAIL_PASSWORD }}"
          mail_from_address = "noreply@bole.to"
          
          # Cost Optimization
          enable_production_features = false
          database_size             = "db-s-1vcpu-1gb"
          app_instance_size         = "basic-xxs"
          EOF

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Get deployment outputs
        id: outputs
        run: |
          echo "gateway_url=$(terraform output -raw gateway_url)" >> $GITHUB_OUTPUT
          echo "hievents_url=$(terraform output -raw hievents_url)" >> $GITHUB_OUTPUT

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to start..."
          sleep 60
          
          # Test gateway health
          max_attempts=10
          attempt=1
          
          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt/$max_attempts: Testing gateway health..."
            
            if curl -sSf "${{ steps.outputs.outputs.gateway_url }}/healthz" > /dev/null; then
              echo "✅ Gateway is healthy"
              break
            fi
            
            if [ $attempt -eq $max_attempts ]; then
              echo "❌ Gateway health check failed after $max_attempts attempts"
              exit 1
            fi
            
            echo "Gateway not ready, waiting 30 seconds..."
            sleep 30
            attempt=$((attempt + 1))
          done

      - name: Run deployment validation
        run: |
          echo "### 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Gateway URL:** ${{ steps.outputs.outputs.gateway_url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Hi.Events Backend:** ${{ steps.outputs.outputs.hievents_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Health Checks:**" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Gateway: ${{ steps.outputs.outputs.gateway_url }}/healthz" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Backend: ${{ steps.outputs.outputs.hievents_url }}/api/public/color-themes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Update mobile app to use staging API" >> $GITHUB_STEP_SUMMARY
          echo "2. Run integration tests" >> $GITHUB_STEP_SUMMARY
          echo "3. Monitor services for stability" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "### ❌ Deployment Failed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The staging deployment encountered an error. Please check the logs above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Common issues:**" >> $GITHUB_STEP_SUMMARY
          echo "- Check if all required secrets are configured" >> $GITHUB_STEP_SUMMARY
          echo "- Verify DigitalOcean and Cloudflare API tokens are valid" >> $GITHUB_STEP_SUMMARY
          echo "- Ensure domain is properly configured in Cloudflare" >> $GITHUB_STEP_SUMMARY