version: "3.9"

services:
  # PostgreSQL for Hi.Events
  postgres_hi:
    image: postgres:15
    container_name: boleto-postgres
    environment:
      POSTGRES_DB: hi_events
      POSTGRES_USER: hi_user
      POSTGRES_PASSWORD: hi_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hi_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and queues
  redis:
    image: redis:7-alpine
    container_name: boleto-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO for S3-compatible storage
  minio:
    image: minio/minio
    container_name: boleto-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Mailpit for email testing
  mailpit:
    image: axllent/mailpit
    container_name: boleto-mailpit
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP

  # Hi.Events Backend (Laravel)
  hi-events:
    build:
      context: ../../services/hi-events/backend
      dockerfile: Dockerfile
    container_name: boleto-hi-events
    env_file: ../../services/hi-events/backend/.env
    depends_on:
      postgres_hi:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ../../services/hi-events/backend:/var/www/html
      - hi_events_storage:/var/www/html/storage
    command: >
      sh -c "
        php artisan migrate --force &&
        php artisan storage:link &&
        php artisan serve --host=0.0.0.0 --port=8000
      "

  # Social Microservice
  social:
    build:
      context: ../../services/social
      dockerfile: Dockerfile
    container_name: boleto-social
    environment:
      PORT: 4001
      NODE_ENV: development
    ports:
      - "4001:4001"
    volumes:
      - ../../services/social:/app
      - /app/node_modules

  # Camera Microservice
  camera:
    build:
      context: ../../services/camera
      dockerfile: Dockerfile
    container_name: boleto-camera
    environment:
      PORT: 4002
      NODE_ENV: development
    ports:
      - "4002:4002"
    volumes:
      - ../../services/camera:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
  minio_data:
  hi_events_storage: